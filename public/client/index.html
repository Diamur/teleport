<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TelePort MVP</title>
  <style>
    :root {
      --bg:#0b0c10;
      --card:#14161f;
      --text:#e9eef6;
      --muted:#a7b2c3;
      --line:#2a2f3a;
      --good:#3ddc97;
      --bad:#ff5c7a;
      --warn:#ffcc66;
    }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width: 980px; margin: 0 auto; padding: 18px; }
    h1 { font-size: 20px; margin: 0 0 14px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius: 14px; padding: 14px; }
    .row { display:flex; gap:10px; flex-wrap: wrap; align-items:center; }
    .sp { height:10px; }
    input { padding: 10px 12px; border-radius: 10px; border:1px solid var(--line); background:#0f1118; color:var(--text); outline:none; }
    input::placeholder{ color: #6f7b8c; }
    button { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background:#0f1118; color:var(--text); cursor:pointer; min-height: 36px; }
    button:hover { border-color:#3a4252; }
    button:disabled { opacity:.6; cursor:not-allowed; background:#0b0c10; color:#6f7b8c; border-color:#2a2f3a; }
    .btn-primary{ background:#1a2236; border-color:#33405d; }
    .btn-danger{ background:#3a1424; border-color:#7a2c4a; color:#ffb3c4; }
    .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; vertical-align:middle; }
    .dot.on { background: var(--good); box-shadow: 0 0 12px rgba(61,220,151,.35); }
    .dot.off{ background: var(--bad); box-shadow: 0 0 12px rgba(255,92,122,.25); }
    .muted { color:var(--muted); }
    .err { color: var(--bad); }
    table { width:100%; border-collapse: collapse; }
    th, td { text-align:left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; font-size: 13px; }
    .tag { font-size:12px; padding: 4px 10px; border-radius: 999px; border:1px solid var(--line); display:inline-flex; align-items:center; gap:6px; background:#0f1118; }
    .tag.on { color: var(--good); border-color: rgba(61,220,151,.35); }
    .tag.off{ color: var(--bad); border-color: rgba(255,92,122,.35); }
    #log { height: 220px; overflow:auto; border:1px solid var(--line); border-radius: 12px; padding: 10px; background:#0f1118; }
    #log div{ padding: 2px 0; white-space: pre-wrap; word-break: break-word; }
    #log.is-collapsed { height: 0; padding: 0; border-width: 0; overflow: hidden; }
    .right { margin-left:auto; }
    .small { font-size: 12px; }
    .checkbox { width:18px; height:18px; accent-color: #6fb5ff; }
    .header-row { align-items:flex-start; }
    .status-line { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
    .action-buttons { gap:8px; }
    .log-header { justify-content: space-between; align-items:center; }
    .log-toggle { display:none; }

    @media (max-width: 768px) {
      .wrap { padding: 14px; }
      .header-row { flex-direction: column; align-items: stretch; gap: 12px; }
      .right { margin-left: 0; width: 100%; }
      .action-buttons { display:grid; grid-template-columns: 1fr 1fr; width:100%; }
      .action-buttons button { width:100%; min-height:44px; font-size:14px; }
      .row input, .row button { width:100%; }
      .users-table thead { display:none; }
      .users-table { border-collapse: separate; border-spacing: 0 12px; }
      .users-table tbody tr {
        display:grid;
        grid-template-columns: 1fr auto;
        grid-template-areas:
          "user status"
          "call call"
          "conf conf";
        gap: 8px 10px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px;
      }
      .users-table tbody td { border:0; padding: 0; }
      .users-table tbody td:nth-child(1) { display:none; }
      .users-table tbody td:nth-child(2) { grid-area: user; font-weight: 600; }
      .users-table tbody td:nth-child(3) { grid-area: status; justify-self: end; }
      .users-table tbody td:nth-child(4) { grid-area: call; }
      .users-table tbody td:nth-child(5) { grid-area: conf; }
      .users-table tbody td:nth-child(4) button,
      .users-table tbody td:nth-child(5) button { width: 100%; min-height: 44px; font-size: 14px; }
      #log { height: 180px; }
      .log-toggle { display:inline-flex; }
    }

    @media (max-width: 420px) {
      .wrap { padding: 10px; }
      .card { padding: 12px; }
      h1 { font-size: 18px; }
      .action-buttons { grid-template-columns: 1fr; }
      .row { gap:8px; }
      button { font-size: 15px; }
      input { font-size: 15px; }
      #log { height: 160px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>TelePort MVP</h1>

    <div id="loginView" class="card">
      <div class="row">
        <input id="login" placeholder="Логин" autocomplete="username" />
        <input id="password" placeholder="Пароль" type="password" autocomplete="current-password" />
        <button id="btnLogin" class="btn-primary">Войти</button>
      </div>
      <div class="sp"></div>
      <div id="loginError" class="err small"></div>
      <div class="sp"></div>
      <div class="muted small">Пользователи берутся из <b>/data/users.ini</b>. Онлайн/оффлайн — по активности в <b>/data/sessions</b>.</div>
    </div>

    <div id="appView" class="card" hidden>
      <div class="row header-row">
        <div class="status-line">
          <span class="dot" id="wsDot"></span>
          <b id="me"></b>
          <span class="muted">·</span>
          <span class="muted" id="wsState">WS: …</span>
          <span class="muted">·</span>
          <span class="muted" id="onlineInfo">онлайн: …</span>
        </div>

        <div class="right row action-buttons">
          <button id="btnConf" class="btn-primary" disabled>🎛️ Конференция</button>
          <button id="btnHangupAll" class="btn-danger" disabled>⛔ Сбросить</button>
          <button id="btnLogout">Выйти</button>
        </div>
      </div>

      <div class="sp"></div>

      <table class="users-table">
        <thead>
          <tr>
            <th style="width:46px;">🎯</th>
            <th>Пользователь</th>
            <th style="width:130px;">Статус</th>
            <th style="width:170px;">Звонок</th>
            <th style="width:210px;">Конференция</th>
          </tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>

      <div class="sp"></div>

      <div class="row">
        <div class="muted small" id="confInfo">Выбери 2+ пользователей “в сети” для конференции.</div>
      </div>

      <div class="sp"></div>
      <div class="row log-header">
        <div class="muted small">Лог</div>
        <button id="logToggle" class="btn-primary log-toggle" type="button">Свернуть лог</button>
      </div>
      <div id="log"></div>

      <div id="remoteAudios" hidden></div>
    </div>
  </div>

  <script src="/client/script.js?v=1"></script>
</body>
</html>
