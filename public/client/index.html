<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TelePort MVP</title>
  <style>
    :root {
      --bg:#0b0c10;
      --card:#14161f;
      --text:#e9eef6;
      --muted:#a7b2c3;
      --line:#2a2f3a;
      --good:#3ddc97;
      --bad:#ff5c7a;
      --warn:#ffcc66;
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width: 980px; margin: 0 auto; padding: 18px; }
    h1 { font-size: 20px; margin: 0 0 14px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius: 14px; padding: 14px; }
    .row { display:flex; gap:10px; flex-wrap: wrap; align-items:center; }
    .sp { height:10px; }
    input { padding: 10px 12px; border-radius: 10px; border:1px solid var(--line); background:#0f1118; color:var(--text); outline:none; }
    input::placeholder{ color: #6f7b8c; }
    button { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background:#0f1118; color:var(--text); cursor:pointer; }
    button:hover { border-color:#3a4252; }
    button:disabled { opacity:.45; cursor:not-allowed; background:#10131b; border-color:#242b38; color:#8a94a6; }
    .btn-primary{ background:#1a2236; border-color:#33405d; }
    .btn-danger{ background:#2a1320; border-color:#5a2740; }
    .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; vertical-align:middle; }
    .dot.on { background: var(--good); box-shadow: 0 0 12px rgba(61,220,151,.35); }
    .dot.off{ background: var(--bad); box-shadow: 0 0 12px rgba(255,92,122,.25); }
    .muted { color:var(--muted); }
    .err { color: var(--bad); }
    table { width:100%; border-collapse: collapse; }
    th, td { text-align:left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; font-size: 13px; }
    .tag { font-size:12px; padding: 4px 10px; border-radius: 999px; border:1px solid var(--line); display:inline-block; }
    .tag.on { color: var(--good); border-color: rgba(61,220,151,.35); background: rgba(61,220,151,.08); }
    .tag.off{ color: var(--bad); border-color: rgba(255,92,122,.35); background: rgba(255,92,122,.08); }
    #log { height: 220px; overflow:auto; border:1px solid var(--line); border-radius: 12px; padding: 10px; background:#0f1118; white-space: pre-wrap; word-break: break-word; }
    #log div{ padding: 2px 0; }
    .right { margin-left:auto; }
    .small { font-size: 12px; }
    .checkbox { width:18px; height:18px; accent-color: #6fb5ff; }
    .status-row { align-items: center; }
    .action-buttons button { min-height: 44px; }
    .log-toggle { display:none; }
    .log-collapsed #log { display:none; }
    .log-collapsed .log-toggle { background:#10131b; }
    .user-name { font-weight: 600; }
    .status-chip-mobile { display:none; }
    .btn-full { width: 100%; }
    .table-card { width:100%; border-collapse: collapse; }
    .users-empty { padding: 10px 0; color: var(--muted); }

    @media (max-width: 768px) {
      .wrap { padding: 12px; }
      .status-row { flex-direction: column; align-items: flex-start; }
      .status-row .right { width: 100%; margin-left: 0; }
      .action-buttons { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:10px; width:100%; }
      .action-buttons button { width: 100%; }
      .log-toggle { display: inline-flex; }
      #log { height: 160px; }
      table, thead, tbody, tr, td { display:block; width:100%; }
      thead { display:none; }
      tr { border:1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 12px; background:#111521; }
      td { border: none; padding: 6px 0; }
      td.col-select { display:none; }
      td.user-cell { display:flex; align-items:center; justify-content: space-between; gap: 10px; }
      td.status-cell { display:none; }
      .status-chip-mobile { display:inline-flex; }
      .btn-full { min-height: 44px; }
      .checkbox { width:22px; height:22px; }
      .row input, .row button { width:100%; }
      .row input { min-height: 44px; }
    }

    @media (max-width: 420px) {
      .wrap { padding: 10px; }
      .card { padding: 12px; border-radius: 12px; }
      button { font-size: 16px; }
      input { font-size: 16px; }
      .action-buttons { grid-template-columns: 1fr; }
      #log { height: 140px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>TelePort MVP</h1>

    <div id="loginView" class="card">
      <div class="row">
        <input id="login" placeholder="Логин" autocomplete="username" />
        <input id="password" placeholder="Пароль" type="password" autocomplete="current-password" />
        <button id="btnLogin" class="btn-primary">Войти</button>
      </div>
      <div class="sp"></div>
      <div id="loginError" class="err small"></div>
      <div class="sp"></div>
      <div class="muted small">Пользователи берутся из <b>/data/users.ini</b>. Онлайн/оффлайн — по активности в <b>/data/sessions</b>.</div>
    </div>

    <div id="appView" class="card" hidden>
      <div class="row status-row">
        <div>
          <span class="dot" id="wsDot"></span>
          <b id="me"></b>
          <span class="muted">·</span>
          <span class="muted" id="wsState">WS: …</span>
          <span class="muted">·</span>
          <span class="muted" id="onlineInfo">онлайн: …</span>
        </div>

        <div class="right row action-buttons">
          <button id="btnConf" class="btn-primary" disabled>🎛️ Конференция</button>
          <button id="btnHangupAll" class="btn-danger" disabled>⛔ Сбросить</button>
          <button id="btnLogout">Выйти</button>
        </div>
      </div>

      <div class="sp"></div>

      <table class="table-card">
        <thead>
          <tr>
            <th style="width:46px;">🎯</th>
            <th>Пользователь</th>
            <th style="width:130px;">Статус</th>
            <th style="width:170px;">Звонок</th>
            <th style="width:210px;">Конференция</th>
          </tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>

      <div class="sp"></div>

      <div class="row">
        <div class="muted small" id="confInfo">Выбери 2+ пользователей “в сети” для конференции.</div>
      </div>

      <div class="sp"></div>
      <div class="row">
        <button id="logToggle" class="log-toggle">Лог (скрыть)</button>
      </div>
      <div class="sp"></div>
      <div id="log"></div>

      <div id="remoteAudios" hidden></div>
    </div>
  </div>

  <script src="/client/script.js?v=1"></script>
</body>
</html>
